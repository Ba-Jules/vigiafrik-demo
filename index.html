    <meta name="theme-color" content="#A65A40" />
    <title>VigiAfrik</title>
    <script>
      // Apply the theme before the first paint (no light flash on a dark phone). Same rules as
      // src/shared/theme/store.ts, which takes over once Vue mounts.
      try {
        var choice = localStorage.getItem('va.theme')
        if (choice !== 'light' && choice !== 'dark' && choice !== 'auto') {
          choice = location.pathname.indexOf('/field') === 0 ? 'light' : 'auto'
        }
        if (choice === 'auto') {
          choice = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
        }
        document.documentElement.dataset.theme = choice
      } catch (e) {}
    </script>
